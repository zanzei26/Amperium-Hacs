    name: Nettleie
  - type: divider
  - entity: sensor.amperium_total_kostnad_brutto_denne_maneden_energi_nettleie
    name: Total brutto (energi + nettleie)
  - type: divider
  - entity: sensor.amperium_kompensasjon_denne_maneden_din_ordning
    name: − Kompensasjon (din ordning)
  - type: divider
  - entity: sensor.amperium_netto_kostnad_denne_maneden_ca
    name: Netto (ca.)
  - type: divider
  - entity: sensor.amperium_norgespris_kompensasjon_denne_maneden
