# Kostnadsoversikt: energi og nettleie hver for seg, total til slutt,
# deretter støtte og netto. Bruker bare innebygde kort.
# Ikke testet i Home Assistant.
#
# Bytt entitets-ID-ene med dine egne (Utviklerverktøy → Tilstander → søk "amperium").
# ID-ene inneholder anleggsnavnet ditt; plassholderne under er forkortet.
#
# Merk: nettleie finnes bare som månedstall (ikke per dag/time) fra Amperium.
# Netto og «sparer» er omtrentlige, se README.

type: entities
title: Kostnad denne måneden
state_color: true
entities:
