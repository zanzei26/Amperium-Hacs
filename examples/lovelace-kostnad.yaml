# Kostnadsoversikt for denne måneden og forrige måned. Bruker bare innebygde kort.
# Ikke testet i Home Assistant.
#
# Bytt entitets-ID-ene med dine egne (Utviklerverktøy → Tilstander → søk "amperium").
# ID-ene inneholder anleggsnavnet ditt og følger navnet sensoren hadde da den ble
# opprettet; plassholderne under er forkortet.
#
# Slik henger tallene sammen (se README, «Kostnad: brutto, støtte og netto»):
#   Total brutto = energi + nettleie før støtte + fastledd
#   Netto        = Total brutto − kompensasjon for din ordning
# Amperiums egen månedstotal er allerede ETTER straumstøtte og uten fastledd.

type: entities
title: Kostnad denne måneden
state_color: true
entities:
  - entity: sensor.amperium_energikostnad_brutto_denne_maneden
    name: Energi (brutto, inkl. mva)
  - entity: sensor.amperium_nettleie_for_straumstotte_denne_maneden
    name: Nettleie før straumstøtte (inkl. kapasitetsledd)
  - entity: sensor.amperium_fastledd_denne_maneden
    name: Fastledd
  - type: divider
  - entity: sensor.amperium_total_brutto_denne_maneden
    name: Total brutto
  - type: divider
  - entity: sensor.amperium_kompensasjon_denne_maneden_din_ordning
    name: − Kompensasjon (din ordning)
  - type: divider
  - entity: sensor.amperium_netto_kostnad_denne_maneden_din_ordning
    name: Netto (ca.)
  - type: divider
  - entity: sensor.amperium_straumstotte_trukket_fra_nettleien_denne_maneden
    name: Til sammenligning, straumstøtte
  - entity: sensor.amperium_norgespris_kompensasjon_denne_maneden
    name: Til sammenligning, Norgespris
  - entity: sensor.amperium_norgespris_sparer_denne_maneden
    name: Norgespris sparer
  - type: section
    label: Kapasitetsledd
