# Eksempel på Lovelace-kort for Amperium.
# Bytt ut entitets-ID-ene hvis dine heter noe annet (sjekk Utviklerverktøy → Tilstander).
# Lim inn via dashbordets råkonfig-editor (⋮ → Rediger dashbord → ⋮ → Rediger i YAML),
# eller legg kortene inn med "Legg til kort → Manuell".

type: vertical-stack
cards:
  - type: markdown
    content: >
      ## Strøm – kraftlagets tall
      HAN-måler:
      {% if is_state('binary_sensor.amperium_han_maler_online','on') %}🟢 online{% else %}🔴 offline{% endif %}

  - type: entities
    title: Forbruk & kostnad denne måneden
    state_color: true
    entities:
      - entity: sensor.amperium_forbruk_denne_maneden
        name: Forbruk denne måneden
      - entity: sensor.amperium_forbruk_i_dag
        name: Forbruk i dag
      - entity: sensor.amperium_effekt_na
        name: Effekt nå
      - type: divider
      - entity: sensor.amperium_kostnad_denne_maneden
        name: Total kostnad
      - entity: sensor.amperium_energikostnad_denne_maneden
        name: — herav energi
      - entity: sensor.amperium_nettleie_denne_maneden
        name: — herav nettleie
      - type: divider
      - entity: sensor.amperium_spotpris_na
        name: Spotpris nå

  - type: gauge
    entity: sensor.amperium_forbruk_denne_maneden
    name: Forbruk denne måneden
    unit: kWh
    min: 0
    max: 2000
    needle: true

  # Historikk (bruker HA sin innebygde statistikk)
  - type: statistics-graph
    title: Kostnad hittil i måneden
    chart_type: line
    period: day
    stat_types:
      - state
    entities:
      - sensor.amperium_kostnad_denne_maneden
